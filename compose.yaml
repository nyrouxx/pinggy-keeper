name: pinggy-keeper

services:
  keeper:
    build: .
    init: true
    restart: unless-stopped
    network_mode: host
    read_only: true
    environment:
      PINGGY_TOKEN: ${PINGGY_TOKEN:?Set PINGGY_TOKEN in .env}
      PINGGY_SERVER: ${PINGGY_SERVER:-free.pinggy.io}
      FREEDNS_TOKEN: ${FREEDNS_TOKEN:?Set FREEDNS_TOKEN in .env}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51820}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
